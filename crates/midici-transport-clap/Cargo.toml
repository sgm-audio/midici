[package]
name = "midici-transport-clap"
description = "CLAP plugin transport adapter with RT-safe bridge for midici"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
clap-ffi = ["clap-sys"]

[dependencies]
midici-core = { path = "../midici-core" }
rand_core = { version = "0.6.4", default-features = false }
clap-sys = { version = "0.4", optional = true }

[dev-dependencies]
rand_xorshift = "0.4"

[lints]
workspace = true

[lints.rust]
# `unsafe` is required for the SPSC ring (raw pointers + atomics)
# and optional CLAP FFI wrappers. All unsafe blocks are documented.
unsafe_code = "allow"
