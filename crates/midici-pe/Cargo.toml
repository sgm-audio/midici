[package]
name = "midici-pe"
description = "MIDI-CI Property Exchange resource model, chunker, Mcoded7, JSON codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["midi", "midi2", "midi-ci", "ump", "sysex"]
categories = ["multimedia::audio", "no-std"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# zlib+Mcoded7 mutualEncoding — M2-103 §6.1.6 / ARD §2
zlib = ["dep:miniz_oxide"]

[dependencies]
midici-core = { path = "../midici-core", version = "0.1.0" }
rand_core = { version = "0.6.4", default-features = false }
miniz_oxide = { version = "0.8", optional = true, default-features = false, features = ["with-alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = "1.6"
rand = "0.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
