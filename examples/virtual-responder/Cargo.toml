[package]
name = "virtual-responder"
description = "Standalone daemon on a virtual ALSA UMP endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
midici-core = { path = "../../crates/midici-core" }
midici-pe = { path = "../../crates/midici-pe" }
midici-responder = { path = "../../crates/midici-responder" }
midici-transport-alsa = { path = "../../crates/midici-transport-alsa" }
rand = "0.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
