[package]
name = "clap-autoprop"
description = "CLAP plugin exposing ChCtrlList from clap_plugin_params"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
midici-responder = { path = "../../crates/midici-responder" }
midici-core = { path = "../../crates/midici-core" }
midici-pe = { path = "../../crates/midici-pe" }
rand_core = { version = "0.6.4", default-features = false }

[dev-dependencies]
rand = "0.8"
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
