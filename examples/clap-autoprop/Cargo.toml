[package]
name = "clap-autoprop"
description = "CLAP plugin exposing ChCtrlList from clap_plugin_params"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clap-sys = "0.4"
midici-transport-clap = { path = "../../crates/midici-transport-clap" }
midici-core = { path = "../../crates/midici-core" }

[lints]
workspace = true

[lints.rust]
# CLAP plugin requires `unsafe` for extern "C" callbacks and FFI.
unsafe_code = "allow"
