name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    container: ubuntu:26.04  # alsa-lib >= 1.2.13 (UMP symbols), matches ci.yml

    steps:
    - uses: actions/checkout@v4
    - name: Install build deps
      run: apt-get update && apt-get install -y libasound2-dev pkg-config build-essential curl
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.97.1"
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
